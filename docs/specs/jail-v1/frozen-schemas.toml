# Current pre-release contract baseline. This project is not live; per the
# jail v2 preamble (§0), a frozen schema or artifact may be re-blessed in
# place under the same identifier: the recorded SHA-256 is regenerated
# together with its fixtures and validators in one reviewable commit, and
# historical milestone evidence remains historical, not proof for this tree.
#
# Re-blessing record:
# - 2026-10-15 re-blessed every frozen schema and artifact for the rename from
#   Ouroboros to Ukai: each `ouro.*` identifier became `ukai.*` and each
#   `urn:ouro:schema:*` `$id` became `urn:ukai:schema:*`, with the receipt,
#   policy and argv digests in the fixtures recomputed for the new domain
#   strings. No field changed meaning. Evidence recorded before the rename
#   keeps the old identifiers; validate_contract.py reads its receipts
#   through that rename.
# - 16336791 re-blessed jail-receipt.schema.json and
#   policy-snapshot.schema.json in place under their existing identifiers
#   (ukai.jail.receipt/1, ukai.jail.policy-snapshot/1). Rationale: additive
#   fields only — the swap, storage and inodes limit ceilings (new snapshot
#   fields; new receipt limit-row kinds, with the receipt's limit-row
#   maximum raised from 4 to 7) plus their enforcement-loss handling. No
#   shared field changed meaning, so no new identifier was required.
# - audit 2026-10-08 (L21) re-blessed network-rules.md in place under
#   ukai.jail.network/1. Rationale: the §Normalization text now states the
#   enforced rule — plaintext HTTP requires a grant that named its port
#   explicitly; the omitted-port expansion to 443 is the TLS shape. The
#   wire vocabulary (ukai.jail.network/1) is unchanged; the change brings
#   the prose in line with what the proxy enforces.
# - 2026-10-10 re-blessed policy-snapshot.schema.json in place under
#   ukai.jail.policy-snapshot/1. Rationale: additive field only — a vault
#   credential may declare the header its placeholder belongs in (`header`
#   with `name` and an optional `prefix`, issue draft 08). No shared field
#   changed meaning.
# - 2026-10-10 re-blessed jail-receipt.schema.json in place under
#   ukai.jail.receipt/1. Rationale: additive field only — a coverage entry
#   may carry `resolver_refused`, counting proxy connections refused for
#   resolver capacity separately from policy denials (issue draft 04). No
#   shared field changed meaning.
# - 2026-10-10 re-blessed jail-event.schema.json in place under
#   ukai.event/1. Rationale: additive branch only — a classified path may be
#   `root_relative` to a named root (an operator grant or a system read-only
#   root, issue draft 10). The denial rules also admit write-class
#   EROFS/EBUSY and mediated EACCES/EPERM net.connect results, matching
#   the producer while retaining prior valid event shapes.

# - 2026-10-13 re-blessed policy-snapshot.schema.json and canonicalization.md in place:
#   additive optional vault paths, executable bindings and OAuth2 refresh.
#   Existing serialized vault policies retain their bytes; historical
#   benchmark evidence is preserved without mutation.
# - 2026-10-14 re-blessed fixtures/semantic-cases.json in place. Rationale:
#   citation prose only — the "rules" citations named lines of an old
#   revision of jail-v1.md, which no longer said what they cited; each now
#   names a section and quotes its text, and both validators check every
#   quote is in the cited section. No case, verdict or rule identifier
#   changed, so no shared field changed meaning.
# - 2026-10-14 re-blessed policy-snapshot.schema.json, jail-receipt.schema.json,
#   canonicalization.md and network-rules.md in place under their existing
#   identifiers (ukai.jail.policy-snapshot/1, ukai.jail.receipt/1,
#   ukai.jail.policy/1, ukai.jail.network/1). Rationale: additive fields
#   only — an optional snapshot set `network.tls_only` (omitted when empty)
#   and an optional receipt list `applied.network.tls_only` name the allow
#   rules every grant of which omitted its port, the bit that decides
#   whether plaintext HTTP is admitted (L21) and that the canonical
#   `host:port` spelling cannot carry. network-rules.md states where the
#   proxy enforces that shape and that a tunnel to an address is not
#   inspected. No shared field changed meaning: a policy with no
#   omitted-port grant keeps its bytes and digest, and one with such a
#   grant now digests that grant's shape.
# - 2026-10-16 (J13, jail-launch-and-summary.md §4 and §7 decisions 5 and
#   8) re-blessed jail-event.schema.json in place under ukai.event/1 and
#   froze the new jail-summary.schema.json as ukai.jail.summary/1.
#   Rationale: additive only. A proxy result may carry `fields.credentials`,
#   the ids (never values, placeholders or digests) of the vault credentials
#   whose placeholder the proxy replaced in a request head it sent upstream
#   whole, and `fields.credentials_unconfirmed`, those substituted into a
#   head it began to send without the whole being confirmed sent; each
#   sorted and unique, absent when empty, and never on a denied result,
#   which the proxy refused before sending any of it (the vault's TLS lane
#   now records a request that failed after its head began to go out as
#   allowed, with the failure as its reason and end, as the plain lane
#   already did). A credential lifecycle note may carry
#   `uses_recorded: true`, which tells a reader the build records those ids
#   (the receipt's `jail.version` cannot, since every build reports the
#   same one), and its existing `credential_id` and `transition` are now
#   stated. A run without a vault journals the frames it did before. New
#   examples: event-proxy-vault.json, event-note-credential.json and
#   summary-agent.json (product output). No shared field changed meaning.
# - 2026-10-16 (J12, jail-launch-and-summary.md §3.2 to §3.4 and §7
#   decision 4) re-blessed jail-receipt.schema.json and
#   policy-snapshot.schema.json in place under their existing identifiers
#   (ukai.jail.receipt/1, ukai.jail.policy-snapshot/1), in one commit as the
#   proposal requires. Rationale: additive only. A receipt grant's `by` was
#   the constant `operator` and is now the enum `operator`,
#   `program_resolution`: a read-only install root `--from-path` derived
#   from the program the operator named is attributed to that resolution,
#   never to the operator (an operator's own `--ro` of the same path keeps
#   `operator`). The snapshot's `roots` may carry `cwd`, the directory the
#   child starts in relative to the workspace, omitted when it is the
#   workspace root, so every policy run from its workspace root keeps its
#   bytes and digest; and a vault credential may carry `env`, the variable
#   its placeholder is bound to in place of UKAI_VAULT_<ID>, omitted when
#   absent. No shared field changed meaning. validate_contract.py's ECMA `$`
#   rewrite now leaves a `$` inside a character class alone (the vault
#   header-name pattern has one), found by the first validation case with a
#   vault header.
# - 2026-10-18 re-blessed jail-doctor.schema.json in place under
#   ukai.jail.doctor/1. Rationale: additive field only. A doctor record may
#   carry `workspace` (`status: "unusable"` and a `reason_code` of
#   `filesystem_root`, `home_directory` or `home_ancestor`) when the plan
#   is contained and its workspace is one every contained run refuses
#   (jail-launch-and-summary.md §3.2 step 3). `doctor` reports such a
#   workspace instead of refusing (§8 item 5) and leaves it out of its
#   placement checks, so a credential stored under the home is no longer
#   reported as lying inside a writable grant (the rc.3 clean-VM run,
#   docs/benchmarks/jail/results/release-preview-2026-10-18-rc3-doctor-home-failed).
#   The field is absent otherwise and does not change `ready`; every record
#   valid before stays valid. No shared field changed meaning.
# - 2026-10-19 (J14, jail-interactive-sessions.md §3.7, §4.7 and §5)
#   re-blessed jail-receipt.schema.json, policy-snapshot.schema.json and
#   jail-summary.schema.json in place under their existing identifiers
#   (ukai.jail.receipt/1, ukai.jail.policy-snapshot/1, ukai.jail.summary/1).
#   Rationale: additive only. A receipt's `state_cleanup` may be `released`
#   (persistent vendor state released and kept by design), and a receipt
#   may carry `vendor_state` (`persistent`: state id, generations, the
#   attempt inherited from, the comparison with the last release, discards
#   and the secret scan; or `attempt_fallback`: the state id, `held` or
#   `unreleased`, and the holder) and `applied.terminal` (an attached
#   terminal: device, session, process group, relayed stops and the
#   settlement restore). A snapshot may carry `terminal: "attached"`,
#   `roots.vendor_state` of kind `persistent` with its launch profile, and
#   `launch.state_discard`, each omitted otherwise, so every detached and
#   attempt-private snapshot keeps its bytes and digest. The summary gains
#   an optional `state` line (facts: the receipt's `vendor_state`) and the
#   `cleanup` line's facts may carry the terminal restore. No shared field
#   changed meaning.
# - 2026-10-22 (J16, jail-macos.md §4.8, §4.9 and §8) re-blessed
#   jail-receipt.schema.json and jail-summary.schema.json in place under
#   their existing identifiers (ukai.jail.receipt/1, ukai.jail.summary/1).
#   Rationale: additive only. A receipt's `applied.terminal.session` was the
#   constant `caller` and is now the enum `caller`, `relay` (the macOS pty
#   relay); a macOS vault credentials item may carry `binding: attempt`.
#   Linux vault receipts omit `binding`, retaining the rc.4 shape. If present,
#   binding is valid only on a macOS vault item and only as `attempt`;
#   an absent field remains valid. The semantic corpus and both ports enforce
#   this rule; the additive wire enum alone does not enforce those semantics.
#   The summary's `survivors` fact gains `none_verified_native` and
#   `none_verified_native_guardian_lost` for `lifetime.boundary`
#   `native_tree` runs. New example: receipt-macos-native.json (hand-written
#   illustrative fixture, not product output, frozen below), and the semantic
#   corpus gains its cases. No shared field changed meaning: a receipt without `binding` keeps its
#   bytes and digest, and a Linux summary line is unchanged.
# - 2026-10-22 (J18, jail-macos.md §6 and §8) re-blessed
#   policy-snapshot.schema.json in place under its existing identifier
#   (ukai.jail.policy-snapshot/1). Rationale: additive field only. A
#   snapshot may carry `lifetime_boundary: "kernel-bound"`, present exactly
#   when the policy requires a kernel-bound attempt lifetime (the derived
#   requirement `owner_loss_termination`); it is omitted otherwise, so
#   every snapshot without the key keeps its bytes and digest. No shared
#   field changed meaning, and no example changed: the field appears only
#   in snapshots that set it.
# - 2026-10-22 (J16–J18, jail-macos.md §4.8–§6) re-blessed
#   jail-doctor.schema.json in place under ukai.jail.doctor/1. Rationale:
#   additive widening only, in the macOS platform branch. The branch still
#   pins every refusal-era rule (no `host`, no `supervisor_scope`, no
#   backend record, `ready` false, the `-apple-darwin` target, probe rows
#   never named as a requirement) and now also states what the native
#   probes measure (jail-macos.md §3–§6): a macOS capability row may be a
#   requirement row derived from the Endpoint Security, Seatbelt,
#   loopback-bind and sysctl probes (mechanism set, `measured_at`
#   RFC3339, an `evidence_ref`, statuses `available`, `unavailable`,
#   `unsupported` or `skipped`, a reason-code pattern instead of the
#   constant) or one of the six host probe rows themselves
#   (es_descendants, es_notify, seatbelt_profile, loopback_bind,
#   bootsessionuuid, maxprocperuid, `owner_loss_termination` joins the
#   requirement names), including the J16 refusal-era rows this replaces
#   on an unentitled host (`unsupported` with `unsupported_platform`).
#   Every record valid before stays valid: the checked-in
#   examples/doctor-macos.json is unchanged and still validates, and the
#   semantic rules the base capability definition states (an available
#   process/tree row says `ok`; a host row is never named as a
#   requirement) are unchanged. No shared field changed meaning.
# - 2026-10-22 DOCS review (D4/D5/D6/D9) re-blessed jail-doctor.schema.json,
#   canonicalization.md and examples/receipt-macos-native.json in place.
#   Doctor widening is additive: macOS may express ready true when its
#   nonempty requirement rows are available; empty readiness claims still
#   refuse. The ready containment requirement for binaries.bwrap is
#   Linux-only. owner_loss_termination is also admitted in
#   the requirement list. All previously valid doctor records remain valid;
#   the refusal example is unchanged. New schema cases are synthetic inputs,
#   not evidence that a native host is ready. canonicalization.md now names
#   the existing optional lifetime_boundary field; old snapshots keep their
#   bytes. The illustrative receipt no longer claims fs.deny or net audit
#   coverage and uses best-effort evidence. The phase-2 entry below aligns native details with the producer. Linux omits credential binding;
#   optional macOS vault binding is attempt, as checked by both validators.
# - 2026-10-22 integration re-blessed fixtures/semantic-cases.json and
#   examples/receipt-macos-native.json in place under their existing identifiers.
#   The corpus adds the integrated binding/record invariants; its program-binding
#   negative case now inserts its own synthetic vault item because the illustrative
#   native receipt has no credentials. Positive cases retain macOS attempt and
#   absent-binding acceptance. Native staging is unsupported. Linux vault
#   receipts omit binding; absence remains valid, and a present binding is only
#   attempt on a macOS vault item. Both semantic validators enforce the same rule.
#   The hand-written receipt now follows the development producer: native_execution
#   dev, profile_parameters, null syscalls, integer custodian events (null without
#   evidence), unknown guardian stream without a record, observation off and
#   existing_and_root coverage. No live execution or drainage is claimed. No schema
#   is narrowed, no shared field changes meaning, and no identifier is bumped.
#   jail-receipt.schema.json is additively widened under ukai.jail.receipt/1:
#   an enforced macOS record may have null applied.syscalls and a null network
#   mechanism under network none, preserving the earlier development shape.
#   Linux still requires both mechanism records; proxy mode still requires its
#   mechanism. Previous native records with those objects remain valid.
#   Validation cases cover the native shapes and retained Linux/proxy refusals.
# - 2026-10-23 final integration re-blessed examples/receipt-macos-native.json
#   in place: network none now records seatbelt-deny-network, matching the
#   integrated producer and its deny-network profile. The example remains
#   illustrative, not live evidence. The schema still accepts the earlier null
#   mechanism; no schema, identifier or shared field meaning is changed.
