[package]
name = "ukai-jail"
description = "Runs an operator-supplied argv under an explicit policy and records what it applied."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "ukai_jail"
path = "src/lib.rs"

[[bin]]
name = "ukai-jail"
path = "src/main.rs"

# J18 (jail-macos.md §6): the per-user warm-guest host program. It reuses the
# preview's installed custodian and VZ client binaries and drives the guest
# over the same vsock protocol; `ukai-jail --vm` and `ukai-jail vm stop` are
# its operators.
[[bin]]
name = "ukai-vm"
path = "src/bin/ukai-vm.rs"

[lints]
workspace = true

[dependencies]
ukai-records.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
sha1 = "0.10.6"
toml.workspace = true
toml_edit = "0.22.27"
zeroize = "1.8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14.10"
webpki-roots = "1.0"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
uuid = { workspace = true, features = ["v4"] }

# build.rs digests the build inputs (build provenance, jail-v1 §16).
[build-dependencies]
sha2.workspace = true

# The ES custody shim (jail-macos §4.1) is compiled by build.rs for macOS
# targets only; `cc` stays a local, single-crate dependency.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dev-dependencies]
jsonschema.workspace = true
# The macOS sandbox tests #[path]-include src/platform/macos/{sandbox,setuid}.rs
# so they exercise the exact shipped sources; the modules use sha2 (the
# template digest) and libc (kern.osversion), which are regular dependencies
# and therefore not visible to integration tests without these lines.
sha2.workspace = true
libc.workspace = true
# The conformance suite drives the real jail through the shared harness and
# runs the shared fixture inside it. No cycle: `ukai-fixture` does not depend
# on `ukai-jail`, and this is a dev-dependency, so nothing ships with it.
ukai-fixture.workspace = true
tempfile.workspace = true
